<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FemGo · Book your ride</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #6A4E8F, #A280C9); }
        .spinner { border: 4px solid rgba(106,78,143,0.2); border-top: 4px solid #6A4E8F; border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 70% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="w-full py-4 px-6 bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="font-bold text-2xl gradient-bg bg-clip-text text-transparent">FemGo</a>
            <a href="index.html" class="text-gray-600 hover:text-[#6A4E8F]">← Back</a>
        </div>
    </nav>
    <main class="max-w-2xl mx-auto px-4 py-12">
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8">
            <h1 class="text-3xl font-bold text-gray-800">Book your ride</h1>
            <p id="vehicleDisplay" class="text-gray-500 mt-1">Selected vehicle: <span class="font-semibold text-[#6A4E8F]">Loading...</span></p>
            <form id="bookingForm" class="mt-6 space-y-5">
                <div>
                    <label class="block font-medium text-gray-700 mb-1">📍 Pickup location *</label>
                    <div class="flex gap-2">
                        <input type="text" id="pickup" required placeholder="e.g., 24.8607,67.0011 or Clifton, Karachi" class="flex-1 border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-[#6A4E8F]">
                        <button type="button" id="getLocationBtn" class="bg-[#6A4E8F] hover:bg-[#5a3d7a] text-white font-medium px-4 py-3 rounded-xl transition flex items-center gap-2 whitespace-nowrap">
                            <i class="fas fa-location-dot"></i> <span class="hidden sm:inline">Get location</span>
                        </button>
                    </div>
                    <div id="locationStatus" class="text-xs text-gray-400 mt-1"></div>
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-1">🎯 Destination *</label>
                    <input type="text" id="destination" required placeholder="e.g., DHA Phase 8" class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-[#6A4E8F]">
                </div>
                <button type="submit" class="w-full gradient-bg text-white font-bold py-3 rounded-xl shadow-md hover:shadow-lg transition">Find my ride →</button>
            </form>
        </div>
    </main>

    <!-- Loading overlay (exactly as before) -->
    <div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,245,0.98); z-index:1000; justify-content:center; align-items:center; backdrop-filter: blur(4px);">
        <div class="text-center max-w-md p-8 bg-white rounded-3xl shadow-2xl">
            <div id="stageSearch">
                <i class="fas fa-car-side text-5xl text-[#6A4E8F] mb-4 animate-pulse"></i>
                <h3 class="text-2xl font-bold text-gray-800">Finding a driver</h3>
                <p class="text-gray-500 mt-2">Looking for available drivers near you...</p>
                <div class="flex justify-center mt-6"><div class="spinner"></div></div>
            </div>
            <div id="stageMatch" class="hidden">
                <i class="fas fa-check-circle text-5xl text-green-500 mb-4"></i>
                <h3 class="text-2xl font-bold text-gray-800">Driver matched!</h3>
                <p class="text-gray-500 mt-2">Sara M. has accepted your request</p>
                <div class="mt-6 p-4 bg-green-50 rounded-xl">
                    <p class="font-semibold"><i class="fas fa-user-circle mr-2"></i> Driver: Sara M. ⭐ 4.98</p>
                    <p class="text-sm text-gray-600 mt-1"><i class="fas fa-car mr-2"></i> White Toyota Corolla · KAE-123</p>
                    <p class="text-sm text-gray-600 mt-1"><i class="fas fa-clock mr-2"></i> Arriving in ~4 minutes</p>
                </div>
                <button id="continueBtn" class="mt-6 gradient-bg text-white px-6 py-2 rounded-xl font-bold">Continue to ride →</button>
            </div>
        </div>
    </div>

    <script>
        // Get vehicle from URL
        const urlParams = new URLSearchParams(window.location.search);
        const vehicle = urlParams.get('vehicle');
        const vehicleNames = { local: 'Local Car (Suzuki Alto)', premium: 'Premium Car (AC + WiFi)', highroof: 'High Roof (Innova)', scooty: 'Scooty' };
        document.getElementById('vehicleDisplay').innerHTML = `Selected vehicle: <span class="font-semibold text-[#6A4E8F]">${vehicleNames[vehicle] || 'Standard'}</span>`;

        // Geocode: accepts coordinates or address
        async function geocodeAddress(address) {
            const coordMatch = address.match(/^([-+]?\d+\.?\d*)[,\s]+([-+]?\d+\.?\d*)$/);
            if (coordMatch) {
                return { lat: parseFloat(coordMatch[1]), lng: parseFloat(coordMatch[2]), display: `coordinates ${coordMatch[1]}, ${coordMatch[2]}` };
            }
            const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}&format=json&limit=1`;
            const res = await fetch(url);
            const data = await res.json();
            if (data && data[0]) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), display: data[0].display_name };
            throw new Error('Location not found');
        }

        // Get location button
        const getLocationBtn = document.getElementById('getLocationBtn');
        const pickupInput = document.getElementById('pickup');
        const locationStatus = document.getElementById('locationStatus');

        getLocationBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert("Geolocation not supported");
                return;
            }
            getLocationBtn.disabled = true;
            getLocationBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Getting...';
            locationStatus.innerHTML = 'Getting your exact GPS coordinates...';
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const coordsText = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                    pickupInput.value = coordsText;
                    const mapsLink = `https://www.google.com/maps?q=${lat},${lng}`;
                    locationStatus.innerHTML = `📍 Coordinates: ${coordsText} → <a href="${mapsLink}" target="_blank" class="text-blue-500 underline">Open in Google Maps</a> to verify. You can also edit the field.`;
                    getLocationBtn.disabled = false;
                    getLocationBtn.innerHTML = '<i class="fas fa-location-dot"></i> <span class="hidden sm:inline">Get location</span>';
                    // toast
                    const toast = document.createElement('div');
                    toast.className = 'fixed bottom-5 left-5 bg-green-100 text-green-700 px-4 py-2 rounded-full shadow-lg z-50 text-sm';
                    toast.innerHTML = '<i class="fas fa-check-circle mr-1"></i> Location added!';
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 2500);
                },
                (error) => {
                    let msg = error.code === 1 ? "Location access denied. Please enable location in browser settings." : "Unable to get location. Check GPS.";
                    alert(msg);
                    locationStatus.innerHTML = msg;
                    getLocationBtn.disabled = false;
                    getLocationBtn.innerHTML = '<i class="fas fa-location-dot"></i> <span class="hidden sm:inline">Get location</span>';
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        });

        // Form submission and redirect
        const form = document.getElementById('bookingForm');
        const overlay = document.getElementById('loadingOverlay');
        const stageSearch = document.getElementById('stageSearch');
        const stageMatch = document.getElementById('stageMatch');
        const continueBtn = document.getElementById('continueBtn');
        const destInput = document.getElementById('destination');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pickup = pickupInput.value.trim();
            const destination = destInput.value.trim();
            if (!pickup || !destination) {
                alert("Please enter both pickup and destination.");
                return;
            }
            overlay.style.display = 'flex';
            stageSearch.classList.remove('hidden');
            stageMatch.classList.add('hidden');

            try {
                const pickupCoords = await geocodeAddress(pickup);
                const destCoords = await geocodeAddress(destination);
                const rideData = {
                    pickupAddress: pickup,
                    destinationAddress: destination,
                    pickupLat: pickupCoords.lat,
                    pickupLng: pickupCoords.lng,
                    destLat: destCoords.lat,
                    destLng: destCoords.lng,
                    vehicle: vehicle || 'local',
                    timestamp: Date.now()
                };
                localStorage.setItem('activeRide', JSON.stringify(rideData));
                console.log('Ride data saved:', rideData);
                setTimeout(() => {
                    stageSearch.classList.add('hidden');
                    stageMatch.classList.remove('hidden');
                }, 2000);
            } catch (err) {
                alert("Could not find one of the locations. Please use more specific names or coordinates.");
                overlay.style.display = 'none';
                console.error(err);
            }
        });

        // Continue button redirect - ensure it works
        continueBtn.addEventListener('click', () => {
            console.log('Continue button clicked, redirecting to tracking.html');
            window.location.href = 'tracking.html';
        });
    </script>
</body>
</html>
