<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FemGO · Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .logo-img { max-height: 50px; width: auto; }
        .gradient-text { background: linear-gradient(135deg, #2A1E3D, #6A4E8F); -webkit-background-clip: text; background-clip: text; color: transparent; }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="w-full py-3 px-6 bg-white shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <img src="/logo.png" alt="FemGO Logo" class="logo-img"  style="width: 140px;">
                <span class="font-bold text-xl gradient-text"></span>
            </a>
            <a href="signup.html" class="text-[#6A4E8F] font-medium">Sign up</a>
        </div>
    </nav>

    <div class="flex min-h-[80vh] items-center justify-center px-4">
        <div class="card-default p-8 max-w-md w-full">
            <h2 class="text-3xl font-bold text-center text-gray-800">Welcome back</h2>
            <p class="text-center text-gray-500 mb-6">Login to access your account</p>
            <form id="loginForm">
                <div class="mb-4">
                    <label class="block font-medium mb-1">Email</label>
                    <input type="email" id="loginEmail" class="w-full border rounded-xl px-4 py-3" required>
                </div>
                <div class="mb-6">
                    <label class="block font-medium mb-1">Password</label>
                    <input type="password" id="loginPassword" class="w-full border rounded-xl px-4 py-3" required>
                </div>
                <button type="submit" class="w-full gradient-bg text-white font-bold py-3 rounded-xl btn-primary">Log in</button>
                <p class="text-center mt-4">Don't have an account? <a href="signup.html" class="text-[#6A4E8F] font-semibold">Sign up</a></p>
                <div id="loginError" class="text-red-500 text-center mt-3 text-sm"></div>
            </form>
        </div>
    </div>

    <script>
        // Get return URL from query string
        const urlParams = new URLSearchParams(window.location.search);
        const returnUrl = urlParams.get('return') || 'index.html';

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const pwd = document.getElementById('loginPassword').value;
            const users = JSON.parse(localStorage.getItem('femgoUsers') || '[]');
            const user = users.find(u => u.email === email && u.password === pwd);
            if(user) {
                localStorage.setItem('loggedInUser', JSON.stringify({ email: user.email, name: user.name }));
                window.location.href = returnUrl;
            } else {
                document.getElementById('loginError').innerText = 'Invalid email or password';
            }
        });
    </script>
</body>
</html>
