<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheDrives · Live Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        nav { z-index: 1000 !important; position: sticky; top: 0; }
        #map { z-index: 1; position: relative; height: 500px; width: 100%; border-radius: 1rem; }
        .leaflet-control-attribution { z-index: 1; }
        .eta-card { background: white; border-radius: 1rem; padding: 0.75rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-gray-50">
<nav class="w-full py-5 px-6 md:px-12 bg-white/80 backdrop-blur-md shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-2"><div class="w-9 h-9 rounded-full gradient-bg flex justify-center items-center"><i class="fas fa-venus text-white"></i></div><span class="font-bold text-2xl gradient-text">SheDrives</span></a>
        <div class="hidden md:flex gap-6"><a href="index.html">Home</a><a href="contact.html">Contact</a><a href="weather.html">Weather</a><a href="location.html">Location</a><div id="authNavLinks"></div></div>
        <button id="mobileMenuBtn" class="md:hidden text-2xl"><i class="fas fa-bars"></i></button>
    </div>
    <div id="mobileMenu" class="fixed inset-0 bg-white z-50 transform translate-x-full transition-transform duration-300 md:hidden"><div class="flex justify-end p-6"><button id="closeMenuBtn" class="text-2xl"><i class="fas fa-times"></i></button></div><div class="flex flex-col items-center gap-7 text-xl pt-10"><a href="index.html">Home</a><a href="contact.html">Contact</a><a href="weather.html">Weather</a><a href="location.html">Location</a><div id="mobileAuthLinks"></div></div></div>
</nav>

<main class="max-w-6xl mx-auto px-4 py-10">
    <div class="card-default p-6">
        <h1 class="text-2xl font-bold"><i class="fas fa-map-marked-alt text-[#6A4E8F] mr-2"></i> Your active ride</h1>
        <div id="rideDetails" class="text-gray-500 mt-1 mb-4"></div>
        <div id="map"></div>
        <div id="etaPanel" class="mt-4 eta-card text-center"><p id="statusText" class="font-semibold">Loading...</p><p id="etaText" class="text-sm text-gray-600"></p></div>
    </div>
</main>

<footer class="bg-gray-900 text-gray-300 py-12 mt-12"><div class="text-center text-xs text-gray-500">© 2025 SheDrives</div></footer>

<script src="auth.js"></script>
<script>
    // Mobile menu (same as before)
    const menuBtn=document.getElementById('mobileMenuBtn'),closeBtn=document.getElementById('closeMenuBtn'),mobileMenu=document.getElementById('mobileMenu');
    if(menuBtn&&closeBtn&&mobileMenu){menuBtn.onclick=()=>mobileMenu.classList.remove('translate-x-full');closeBtn.onclick=()=>mobileMenu.classList.add('translate-x-full');}
    let rideData = JSON.parse(localStorage.getItem('activeRide'));
    if(!rideData){ alert("No active ride."); window.location.href='index.html'; }
    document.getElementById('rideDetails').innerHTML = `<i class="fas fa-map-pin text-[#6A4E8F]"></i> From: ${rideData.pickupAddress} → <i class="fas fa-flag-checkered text-green-600"></i> To: ${rideData.destinationAddress}`;

    let map, driverMarker, passengerMarker, routeLine, interval, driverRoute = [], driverIndex = 0, tripStarted = false;

    function initMap(){
        map = L.map('map').setView([rideData.pickupLat, rideData.pickupLng], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OSM'}).addTo(map);
        L.marker([rideData.pickupLat, rideData.pickupLng],{icon:L.divIcon({html:'<div style="background:#22c55e; width:16px;height:16px;border-radius:50%;border:2px solid white;"></div>',iconSize:[16,16]})}).addTo(map).bindPopup('Pickup');
        L.marker([rideData.destLat, rideData.destLng],{icon:L.divIcon({html:'<div style="background:#ef4444; width:16px;height:16px;border-radius:50%;border:2px solid white;"></div>',iconSize:[16,16]})}).addTo(map).bindPopup('Destination');
        startPassengerTracking();
        startDriverSimulation();
    }

    function startPassengerTracking(){
        if(navigator.geolocation){
            navigator.geolocation.watchPosition(pos=>{
                let {latitude:lat, longitude:lng}=pos.coords;
                if(passengerMarker) map.removeLayer(passengerMarker);
                passengerMarker = L.marker([lat,lng],{icon:L.divIcon({html:'<div style="background:#6A4E8F; width:14px;height:14px;border-radius:50%;border:2px solid white;"></div>',iconSize:[14,14]})}).addTo(map).bindPopup('You');
            },null,{enableHighAccuracy:true});
        }
    }

    async function getRoute(startLat,startLng,endLat,endLng){
        let url=`https://router.project-osrm.org/route/v1/driving/${startLng},${startLat};${endLng},${endLat}?overview=full&geometries=geojson`;
        let res=await fetch(url);
        let data=await res.json();
        if(data.code==='Ok' && data.routes.length) return data.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
        return [];
    }

    function dist(p1,p2){ let R=6371; let dLat=(p2[0]-p1[0])*Math.PI/180; let dLng=(p2[1]-p1[1])*Math.PI/180; let a=Math.sin(dLat/2)**2+Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLng/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
    function polylineDistance(points){ let d=0; for(let i=0;i<points.length-1;i++) d+=dist(points[i],points[i+1]); return d;}

    async function startDriverSimulation(){
        let fullRoute = await getRoute(rideData.pickupLat, rideData.pickupLng, rideData.destLat, rideData.destLng);
        if(fullRoute.length){
            routeLine = L.polyline(fullRoute, {color:'#0077ff', weight:5, opacity:0.7}).addTo(map);
            map.fitBounds(routeLine.getBounds());
        }
        let offset=()=>(Math.random()-0.5)*0.02;
        let start=[rideData.pickupLat+offset(), rideData.pickupLng+offset()];
        driverRoute = await getRoute(start[0],start[1], rideData.pickupLat, rideData.pickupLng);
        if(!driverRoute.length) return;
        driverIndex=0;
        driverMarker = L.marker(driverRoute[0],{icon:L.divIcon({html:'<div style="background:#3b82f6; width:24px;height:24px;border-radius:50%;border:3px solid white;"></div>',iconSize:[24,24]})}).addTo(map);
        let speed=30, idx=0;
        interval=setInterval(()=>{
            if(idx>=driverRoute.length-1){
                clearInterval(interval);
                document.getElementById('statusText').innerHTML="✅ Driver arrived! Starting trip...";
                setTimeout(()=>startTrip(),2000);
                return;
            }
            idx++;
            driverMarker.setLatLng(driverRoute[idx]);
            let remaining=driverRoute.slice(idx);
            let remDist=polylineDistance(remaining);
            let eta=Math.ceil((remDist/speed)*60);
            document.getElementById('etaText').innerHTML=`⏱️ Driver ETA: ~${eta} min`;
            if(remDist<0.1) document.getElementById('etaText').innerHTML="🚗 Driver is arriving now";
        },1000);
    }

    async function startTrip(){
        if(interval) clearInterval(interval);
        let startPos = passengerMarker ? passengerMarker.getLatLng() : {lat:rideData.pickupLat, lng:rideData.pickupLng};
        let routeToDest = await getRoute(startPos.lat, startPos.lng, rideData.destLat, rideData.destLng);
        if(!routeToDest.length) return;
        if(routeLine) map.removeLayer(routeLine);
        routeLine = L.polyline(routeToDest, {color:'#0077ff', weight:5, opacity:0.8}).addTo(map);
        map.fitBounds(routeLine.getBounds());
        driverRoute = routeToDest; driverIndex=0; driverMarker.setLatLng(driverRoute[0]);
        document.getElementById('statusText').innerHTML="🚖 On your way to destination!";
        let speed=40, idx=0;
        interval=setInterval(()=>{
            if(idx>=driverRoute.length-1){
                clearInterval(interval);
                document.getElementById('statusText').innerHTML="📍 Trip completed!";
                document.getElementById('etaText').innerHTML="Thank you for riding.";
                return;
            }
            idx++;
            driverMarker.setLatLng(driverRoute[idx]);
            let remaining=driverRoute.slice(idx);
            let remDist=polylineDistance(remaining);
            let eta=Math.ceil((remDist/speed)*60);
            document.getElementById('etaText').innerHTML=`⏱️ ETA to destination: ~${eta} min`;
        },1000);
    }

    window.addEventListener('load',initMap);
</script>
</body>
</html>
